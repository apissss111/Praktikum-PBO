<!DOCTYPE html>
<html>
<head>
    <title>Pelanggan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Selamat Datang, Pelanggan kami!</h1>

    <div style="text-align: right;">
    <button onclick="logout()">Logout</button>
</div>

    <section class="card">
        <h2>Reservasi Booth</h2>

        <form id="reservation-form">

            <div class="form-group">
                <label>Nama</label>
                <input id="namaPelanggan" required>
            </div>

            <div class="form-group">
                <label>Pilih Booth</label>
                <select id="pilihBooth"></select>
            </div>

            <div class="form-group">
                <label>Tanggal</label>
                <input type="date" id="tanggal">
            </div>

            <div class="form-actions">
                <button class="button button--primary">Reservasi</button>
            </div>

        </form>
    </section>

    <section class="card">
        <h2>Daftar Reservasi</h2>
        <div id="reservationList"></div>
    </section>

    <section class="card">
        <h2>Booth Tersedia</h2>
        <div id="hasil"></div>
    </section>

</div>

<script src="script.js"></script>
<script>

function logout() {
    localStorage.removeItem("role");
    localStorage.removeItem("username");

    window.location.href = "index.html";
}
</script>

</body>
</html>
