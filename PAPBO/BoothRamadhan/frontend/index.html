<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Login - Booth Ramadhan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="hero">
    <div class="hero__content">

        <span class="eyebrow">Booth Ramadhan</span>
        <h1>Selamat Datang</h1>
        <p>Silakan login untuk melanjutkan penyewaan booth.</p>

        <section class="card">
            <h2>Login</h2>

            <form id="login">
                <div class="form-group">
                    <label>Username</label>
                    <input id="u" type="text" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input id="p" type="password" required>
                </div>

                <div class="form-actions">
                    <button class="button button--primary">Login</button>
                </div>
            </form>

            <p class="muted">
                Belum punya akun? <a href="register.html">Daftar</a>
            </p>
        </section>

    </div>
</main>

<script>
const API = "http://localhost:8080";

login.onsubmit = async e => {
    e.preventDefault();

    const res = await fetch(API + "/auth/login", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({
            username: u.value,
            password: p.value
        })
    });

    const result = await res.text();

    if (result === "admin") {
        location.href = "admin.html";
    } else if (result === "user") {
        location.href = "pelanggan.html";
    } else {
        alert("Login gagal");
    }
};
</script>

</body>
</html>
