<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="hero">
    <div class="hero__content">

        <span class="eyebrow">Booth Ramadhan</span>
        <h1>Buat Akun</h1>

        <section class="card">
            <form id="register">
                <div class="form-group">
                    <label>Username</label>
                    <input id="ru" type="text" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input id="rp" type="password" required>
                </div>

                <div class="form-actions">
                    <button class="button button--primary">Daftar</button>
                </div>
            </form>

            <p class="muted">
                Sudah punya akun? <a href="index.html">Login</a>
            </p>
        </section>

    </div>
</main>

<script>
const API = "http://localhost:8080";

register.onsubmit = async e => {
    e.preventDefault();

    await fetch(API + "/auth/register", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({
            username: ru.value,
            password: rp.value
        })
    });

    alert("Berhasil daftar!");
    location.href = "index.html";
};
</script>

</body>
</html>
